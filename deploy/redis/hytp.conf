# 汉韵同袍 Redis 内存封顶（2C2G 单机）。追加到 /etc/redis/redis.conf 或放 /etc/redis/redis.conf.d/hytp.conf
# Redis 仅作缓存（common/config main.php 的 cache 组；JWT 无服务端 session），可安全淘汰。

maxmemory 128mb
maxmemory-policy allkeys-lru        # 内存满时淘汰最久未用的键（纯缓存场景安全）

# 纯缓存不需要持久化，关掉省内存和磁盘 IO（重启丢缓存无害，会重建）
save ""
appendonly no

# 只监听本机（同机各服务访问，不对公网暴露）
bind 127.0.0.1
protected-mode yes
