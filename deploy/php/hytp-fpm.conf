; 汉韵同袍 PHP-FPM 进程池（2C2G 单机）。
; Debian 13 默认 PHP 8.4 → 放 /etc/php/8.4/fpm/pool.d/hytp.conf（若装了 8.3 则相应目录）。
; 用独立 socket（版本无关名，8.3/8.4 通用，nginx 里也用此名），避免和系统默认 www 池混用。
; 装：apt install php8.4-fpm php8.4-mysql php8.4-redis php8.4-curl php8.4-mbstring php8.4-bcmath php8.4-gd
;     （php8.4-mysql 的 mysqlnd 同时兼容 MariaDB，无需额外驱动）
;
; 内存预算：单 worker 峰值约 40-50MB，2G 机器给 PHP 约 250MB → max_children=6 稳妥。
; 2 核 CPU，PHP 多为 IO 等待（DB/OSS/AI），6 个并发够撑 MVP。

[hytp]
user = www-data
group = www-data

listen = /run/php/hytp-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 动态进程管理，控制内存上限
pm = dynamic
pm.max_children = 6          ; 硬上限，×~45MB ≈ 270MB
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500        ; 每 worker 处理 500 请求后重启，防内存泄漏累积

; 慢日志（排查卡顿）
request_slowlog_timeout = 5s
slowlog = /var/log/hytp-fpm.slow.log

; 生产关错误回显（错误进日志不进响应）
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/hytp-fpm.error.log
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 13M
; 本地 CA（解决 OSS/STS/DeepSeek 等 HTTPS 出站验证；Linux 一般已有系统包，指明更稳）
php_admin_value[curl.cainfo] = /etc/ssl/certs/ca-certificates.crt
php_admin_value[openssl.cafile] = /etc/ssl/certs/ca-certificates.crt
