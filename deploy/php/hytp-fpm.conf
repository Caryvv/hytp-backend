; 汉韵同袍 PHP-FPM 进程池（2C2G 单机）。放 /etc/php/8.3/fpm/pool.d/hytp.conf
; 用独立 socket，避免和系统默认 www 池混用。装：apt install php8.3-fpm php8.3-mysql php8.3-redis php8.3-curl php8.3-mbstring php8.3-bcmath php8.3-gd
;
; 内存预算：单 worker 峰值约 40-50MB，2G 机器给 PHP 约 250MB → max_children=6 稳妥。
; 2 核 CPU，PHP 多为 IO 等待（DB/OSS/AI），6 个并发够撑 MVP。

[hytp]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-hytp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 动态进程管理，控制内存上限
pm = dynamic
pm.max_children = 6          ; 硬上限，×~45MB ≈ 270MB
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500        ; 每 worker 处理 500 请求后重启，防内存泄漏累积

; 慢日志（排查卡顿）
request_slowlog_timeout = 5s
slowlog = /var/log/php8.3-fpm-hytp.slow.log

; 生产关错误回显（错误进日志不进响应）
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/log/php8.3-fpm-hytp.error.log
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 13M
; 本地 CA（解决 OSS/STS/DeepSeek 等 HTTPS 出站验证；Linux 一般已有系统包，指明更稳）
php_admin_value[curl.cainfo] = /etc/ssl/certs/ca-certificates.crt
php_admin_value[openssl.cafile] = /etc/ssl/certs/ca-certificates.crt
