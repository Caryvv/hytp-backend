# 汉韵同袍 Nginx 配置（单机 2C2G）。放 /etc/nginx/conf.d/hytp.conf，改掉 example.com 域名。
# 三站点：
#   api.example.com       —— Android 用户端 API（后端 api/web，PHP 根路径）
#   merchant.example.com  —— 商家端 SPA + /merchant API
#   admin.example.com     —— 管理端 SPA + /admin API（建议 IP 白名单）
#
# 前缀剥离：SPA 在站点根，后端 API 在 /merchant(/admin) 前缀。API 请求转发给后端 index.php 时，
# 把 REQUEST_URI 改写成去前缀后的路径、SCRIPT_NAME 伪装成 /index.php，Yii 看到的与开发期
# vite 代理(rewrite 去前缀)完全一致，后端路由零改动。SPA 为 hash 路由，客户端导航不占服务端路径。
#
# 上 HTTPS：certbot --nginx -d api.example.com -d merchant.example.com -d admin.example.com

# gzip 由 Debian 默认 /etc/nginx/nginx.conf 已开启（http 块顶层），此处不再重复声明，
# 否则 nginx -t 报 "gzip directive is duplicate"。需自定义 gzip_types 时改默认 nginx.conf。

# ===================== ① 用户端 API（Android） =====================
server {
    listen 80;
    server_name api.example.com;
    root /var/www/hytp-backend/api/web;
    index index.php;

    client_max_body_size 12m;   # 图片走 OSS 直传，这里仅兜底中转上传(<=10M)

    location /uploads/ { expires 7d; try_files $uri =404; }   # 本地兜底上传目录

    # APK 下载目录（应用内更新）。管理端分片上传合并后的 APK 落在 api/web/downloads/，供手机直接下载。
    location /downloads/ { try_files $uri =404; }

    location / { try_files $uri /index.php$is_args$args; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/hytp-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known) { deny all; }   # 禁 .git/.env 等
}

# ===================== ② 商家端 SPA + API =====================
server {
    listen 80;
    listen 8080;                # 无域名内测：公网 IP:8080 直达商家端（商家须公网访问，有 JWT 登录保护）
    server_name merchant.example.com;
    root /var/www/hytp-web/merchant/dist;
    index index.html;

    client_max_body_size 2m;    # 商家图片走 OSS 直传，接口只传 JSON

    # /merchant/* → 商家后端入口（去前缀，伪装根路径）
    location ~ ^/merchant/(?<apipath>.*)$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/hytp-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/hytp-backend/merchant/web/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/hytp-backend/merchant/web;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     /$apipath$is_args$args;
        fastcgi_read_timeout 30s;
    }

    location /assets/ { expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }   # SPA 入口兜底
}

# ===================== ③ 管理端 SPA + API =====================
server {
    listen 80;
    listen 127.0.0.1:8081;      # 无域名内测：管理端只绑本机 8081，不对公网暴露。
                                # 本地访问走 SSH 隧道：ssh -L 8081:127.0.0.1:8081 root@服务器IP，再开 http://localhost:8081
    server_name admin.example.com;
    root /var/www/hytp-web/admin/dist;
    index index.html;

    client_max_body_size 2m;

    # 安全红线：管理端不对公网开放。当前走本机 8081 + SSH 隧道（见上）。
    # 若将来上域名走公网，取消注释并填 IP 段做白名单：
    # allow 203.0.113.0/24;
    # deny all;

    location ~ ^/admin/(?<apipath>.*)$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/hytp-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/hytp-backend/admin/web/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/hytp-backend/admin/web;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     /$apipath$is_args$args;
        fastcgi_read_timeout 30s;
    }

    location /assets/ { expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
